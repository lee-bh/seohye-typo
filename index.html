<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>East Asian Typography History</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Outfit:wght@300;400;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="app">
        <header>
            <h1>東アジア・タイポグラフィ年表</h1>
            <div class="controls">
                <button id="zoom-in" class="icon-btn" aria-label="Zoom In">+</button>
                <button id="zoom-out" class="icon-btn" aria-label="Zoom Out">-</button>
                <button id="reset-view" class="icon-btn" aria-label="Reset View">↺</button>
                <button id="add-sheet4-btn" class="primary-btn">時代区分（新規）</button>
                <button id="add-item-btn" class="primary-btn">時代区分（追加）</button>
            </div>
        </header>

        <main id="timeline-container">
            <div id="timeline-axis"></div>
            <div id="timeline-content">
                <!-- Timeline items will be injected here -->
            </div>
        </main>

        <!-- Edit/Add Modal -->
        <div id="modal-overlay" class="hidden">
            <div class="modal">
                <div class="modal-header">
                    <h2 id="modal-title">項目編集</h2>
                    <button id="close-modal" class="close-btn">&times;</button>
                </div>
                <form id="item-form">
                    <input type="hidden" name="_row" id="edit-row">

                    <div class="form-group">
                        <label for="nation">国</label>
                        <select name="nation" id="edit-nation" required>
                            <option value="韓国">韓国</option>
                            <option value="中国">中国</option>
                            <option value="日本">日本</option>
                            <option value="その他">その他</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="category">カテゴリー</label>
                        <select name="category" id="edit-category" required>
                            <option value="条約">条約</option>
                            <option value="学会">学会</option>
                            <option value="出版">出版</option>
                            <option value="展示">展示</option>
                            <option value="教育">教育</option>
                            <option value="研究">研究</option>
                            <option value="字体">字体</option>
                            <option value="標準">標準</option>
                            <option value="制度">制度</option>
                            <option value="政策">政策</option>
                            <option value="サービス">サービス</option>
                            <option value="傾向">傾向</option>
                            <option value="技術">技術</option>
                            <option value="理論">理論</option>
                            <option value="運動">運動</option>
                            <option value="広告">広告</option>
                            <option value="芸術">芸術</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="yr">年</label>
                        <input type="number" name="yr" id="edit-yr" required placeholder="e.g. 1443">
                    </div>

                    <div class="form-group">
                        <label for="item">項目名</label>
                        <input type="text" name="item" id="edit-item" required placeholder="Item Title">
                    </div>

                    <div class="form-group">
                        <label for="info">説明</label>
                        <textarea name="info" id="edit-info" rows="3" placeholder="Details..."></textarea>
                    </div>

                    <div class="form-group">
                        <label for="link">リンク</label>
                        <input type="url" name="link" id="edit-link" placeholder="https://...">
                    </div>

                    <div class="form-group">
                        <label for="cite">引用</label>
                        <input type="text" name="cite" id="edit-cite" placeholder="Source">
                    </div>

                    <div class="modal-actions">
                        <button type="button" id="delete-btn" class="danger-btn hidden">Delete</button>
                        <button type="submit" class="primary-btn">Save Changes</button>
                    </div>
                </form>
            </div>
        </div>

        <div id="loading-indicator" class="hidden">
            <div class="spinner"></div>
            <span>Loading History...</span>
        </div>
    </div>

    <!-- Sheet4 Modal -->
    <div id="modal-overlay-s4" class="hidden">
        <div class="modal">
            <div class="modal-header">
                <h2 id="modal-title-s4">時代区分（新規）</h2>
                <button id="close-modal-s4" class="close-btn">&times;</button>
            </div>
            <form id="item-form-s4">
                <input type="hidden" name="_row" id="edit-row-s4">
                <input type="hidden" name="sheet" value="sheet4">

                <div class="form-group">
                    <label for="country">国</label>
                    <input type="text" name="country" id="edit-country-s4" required placeholder="e.g. 한국">
                </div>

                <div class="form-group">
                    <label for="theme">大項目</label>
                    <input type="text" name="theme" id="edit-theme-s4" required placeholder="e.g. 왕조">
                </div>

                <div class="form-group">
                    <label for="begin">開始年</label>
                    <input type="number" name="begin" id="edit-begin-s4" required placeholder="e.g. 1392">
                </div>

                <div class="form-group">
                    <label for="end">終了年</label>
                    <input type="number" name="end" id="edit-end-s4" required placeholder="e.g. 1910">
                </div>

                <div class="form-group">
                    <label for="layer">レイヤー(1-31)</label>
                    <input type="number" name="layer" id="edit-layer-s4" required min="1" max="31" placeholder="1-31">
                </div>

                <div class="form-group">
                    <label for="title">内容</label>
                    <input type="text" name="title" id="edit-title-s4" required placeholder="e.g. 조선시대">
                </div>

                <div class="modal-actions">
                    <button type="button" id="delete-btn-s4" class="danger-btn hidden">削除</button>
                    <button type="submit" class="primary-btn">保存</button>
                </div>
            </form>
        </div>
    </div>

    <script src="app.js?v=2"></script>
</body>

</html>
